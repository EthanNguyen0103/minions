<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ULTRA MINIONS</title>

<style>

body{

margin:0;
overflow:hidden;
background:linear-gradient(#4facfe,#00f2fe);
font-family:Arial;
color:white;

}

#score{

position:fixed;
top:10px;
left:10px;
font-size:25px;
font-weight:bold;

}

.minion{

width:120px;
height:200px;
background:linear-gradient(#ffe259,#ffa751);
border-radius:60px;
position:absolute;

transition:0.3s;

}

/* eye */

.eye{

width:50px;
height:50px;
background:white;
border-radius:50%;
border:5px solid gray;
position:absolute;
top:30px;
left:30px;
overflow:hidden;

}

.pupil{

width:15px;
height:15px;
background:black;
border-radius:50%;
position:absolute;
top:18px;
left:18px;

}

/* pants */

.pants{

position:absolute;
bottom:0;
width:100%;
height:70px;
background:#2b65ec;
border-radius:0 0 60px 60px;

}

/* banana */

.banana{

position:absolute;
font-size:40px;
cursor:pointer;

}

/* jump */

.jump{

transform:translateY(-50px);

}

</style>

</head>

<body>

<div id="score">Score: 0</div>

<div class="minion" style="left:100px;top:300px">
<div class="eye"><div class="pupil"></div></div>
<div class="pants"></div>
</div>

<div class="minion" style="left:300px;top:300px">
<div class="eye"><div class="pupil"></div></div>
<div class="pants"></div>
</div>

<script>

let score=0

/* banana spawn */

function spawnBanana(){

let banana=document.createElement("div")

banana.innerHTML="🍌"

banana.className="banana"

banana.style.left=Math.random()*window.innerWidth+"px"
banana.style.top="0px"

document.body.appendChild(banana)


let fall=setInterval(()=>{

banana.style.top=

banana.offsetTop+5+"px"


/* catch */

document.querySelectorAll(".minion").forEach(m=>{

if(hit(banana,m)){

score++

document.getElementById("score").innerText="Score: "+score

banana.remove()

clearInterval(fall)

}

})

},30)


setTimeout(()=>{

banana.remove()

clearInterval(fall)

},5000)

}

setInterval(spawnBanana,2000)


/* collision */

function hit(a,b){

let ar=a.getBoundingClientRect()
let br=b.getBoundingClientRect()

return !(
ar.right<br.left ||
ar.left>br.right ||
ar.bottom<br.top ||
ar.top>br.bottom
)

}


/* eye follow */

document.addEventListener("mousemove", e=>{

document.querySelectorAll(".eye").forEach(eye=>{

let pupil=eye.querySelector(".pupil")

let rect=eye.getBoundingClientRect()

let dx=e.clientX-rect.left-25
let dy=e.clientY-rect.top-25

let angle=Math.atan2(dy,dx)

let r=10

pupil.style.left=25+Math.cos(angle)*r-7+"px"
pupil.style.top=25+Math.sin(angle)*r-7+"px"

})

})


/* jump */

document.querySelectorAll(".minion").forEach(m=>{

m.onclick=()=>{

m.classList.add("jump")

setTimeout(()=>{

m.classList.remove("jump")

},300)

}

})


/* random walk */

setInterval(()=>{

document.querySelectorAll(".minion").forEach(m=>{

m.style.left=Math.random()*window.innerWidth+"px"

})

},3000)


/* drag */

let active=null

document.onmousedown=e=>{

if(e.target.closest(".minion"))

active=e.target.closest(".minion")

}

document.onmousemove=e=>{

if(active){

active.style.left=e.clientX-60+"px"
active.style.top=e.clientY-100+"px"

}

}

document.onmouseup=()=>active=null


</script>

</body>
</html>
