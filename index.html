<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO Safari Minions Kevin & Bob</title>

<style>

body{

margin:0;
height:100vh;
background:linear-gradient(#00c6ff,#0072ff);

display:flex;
justify-content:center;
align-items:center;
gap:40px;

overflow:hidden;

-webkit-user-select:none;
user-select:none;

}


/* ================= */
/* MINION BASE */
/* ================= */

.minion{

width:150px;
height:240px;

background:linear-gradient(#ffe259,#ffa751);

border-radius:80px;

position:relative;

box-shadow:0 15px 30px rgba(0,0,0,0.3);

transition:0.3s;

}


/* jump */

.jump{

transform:translateY(-60px);

}


/* strap */

.strap{

position:absolute;
top:60px;

width:100%;
height:15px;

background:black;

}


/* eye */

.eye{

position:absolute;

background:white;

border-radius:50%;

border:6px solid gray;

overflow:hidden;

}


/* kevin eye */

.kevin .eye{

top:35px;
left:45px;

width:60px;
height:60px;

}


/* pupil */

.pupil{

position:absolute;

width:20px;
height:20px;

background:black;

border-radius:50%;

left:20px;
top:20px;

transition:0.05s;

}


/* blink */

.blink{

height:5px !important;

}


/* mouth */

.mouth{

position:absolute;

border-bottom:5px solid black;

border-radius:50%;

}


/* kevin mouth */

.kevin .mouth{

top:120px;
left:40px;

width:70px;
height:30px;

}


/* pants */

.pants{

position:absolute;
bottom:0;

width:100%;
height:80px;

background:#2b65ec;

border-radius:0 0 80px 80px;

}



/* ================= */
/* BOB */
/* ================= */

.bob{

height:200px;

}


/* bob eyes */

.bob .eye1{

top:40px;
left:25px;

width:55px;
height:55px;

}


.bob .eye2{

top:50px;
left:85px;

width:40px;
height:40px;

}


/* bob mouth */

.bob-mouth{

top:110px;
left:35px;

width:80px;
height:40px;

border-bottom:6px solid black;

border-radius:0 0 80px 80px;

}

</style>

</head>

<body>


<!-- KEVIN -->

<div class="minion kevin">

<div class="strap"></div>

<div class="eye">
<div class="pupil"></div>
</div>

<div class="mouth"></div>

<div class="pants"></div>

</div>



<!-- BOB -->

<div class="minion bob">

<div class="strap"></div>

<div class="eye eye1">
<div class="pupil"></div>
</div>

<div class="eye eye2">
<div class="pupil"></div>
</div>

<div class="mouth bob-mouth"></div>

<div class="pants"></div>

</div>




<script>


/* ================= */
/* EYES FOLLOW */
/* ================= */

function moveEyes(x,y){

document.querySelectorAll(".eye").forEach(eye=>{

let pupil = eye.querySelector(".pupil")

let rect = eye.getBoundingClientRect()

let centerX = rect.width/2
let centerY = rect.height/2

let dx = x - rect.left - centerX
let dy = y - rect.top - centerY

let angle = Math.atan2(dy,dx)

let radius = 10

let px = centerX + Math.cos(angle)*radius -10
let py = centerY + Math.sin(angle)*radius -10

pupil.style.left = px+"px"
pupil.style.top = py+"px"

})

}


/* mouse */

document.addEventListener("mousemove", e=>{

moveEyes(e.clientX,e.clientY)

})


/* touch */

document.addEventListener("touchmove", e=>{

moveEyes(

e.touches[0].clientX,

e.touches[0].clientY

)

})



/* ================= */
/* JUMP */
/* ================= */

document.querySelectorAll(".minion").forEach(minion=>{

minion.addEventListener("click", ()=>{

minion.classList.add("jump")

setTimeout(()=>{

minion.classList.remove("jump")

},300)

})

})



/* ================= */
/* DRAG SAFARI */
/* ================= */

let active=null


document.addEventListener("touchstart", e=>{

if(e.target.closest(".minion")){

active=e.target.closest(".minion")

}

})


document.addEventListener("touchmove", e=>{

if(active){

active.style.position="absolute"

active.style.left=e.touches[0].clientX-75+"px"

active.style.top=e.touches[0].clientY-120+"px"

}

})


document.addEventListener("touchend", ()=>{

active=null

})



/* ================= */
/* BLINK */
/* ================= */

setInterval(()=>{

document.querySelectorAll(".eye").forEach(eye=>{

eye.classList.add("blink")

setTimeout(()=>{

eye.classList.remove("blink")

},200)

})

},3000)



/* ================= */
/* CHANGE COLOR */
/* ================= */

document.querySelectorAll(".minion").forEach(minion=>{

minion.addEventListener("dblclick", ()=>{

let colors=[

"linear-gradient(red,yellow)",

"linear-gradient(green,yellow)",

"linear-gradient(purple,pink)",

"linear-gradient(cyan,blue)"

]

minion.style.background=

colors[Math.floor(Math.random()*colors.length)]

})

})


</script>


</body>
</html>
